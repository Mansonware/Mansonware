<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="326" viewBox="0 0 820 326" fill="none" font-family="monospace">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a110d"/><stop offset="100%" stop-color="#050806"/>
