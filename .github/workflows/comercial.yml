name: Testar site comercial
on:
  push:
    branches: [main]
    paths:
      ["comercial/**", "comercial-tools/**", ".github/workflows/comercial.yml"]
  pull_request:
    paths:
      ["comercial/**", "comercial-tools/**", ".github/workflows/comercial.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador e auditoria
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          npx playwright install chromium --with-deps
      - name: Testar aquisição, acessibilidade e privacidade
        run: |
          METRICS_URL=https://metrics.test node comercial-tools/build.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-comercial &
          for n in {1..20}; do curl -sf http://127.0.0.1:4173/ -o /dev/null && break; sleep 1; done
          node comercial-tools/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-comercial
          path: test-results/
          retention-days: 7
