m]=i.checked;up()})}function read(){st.niche=$('#niche').value;st.business=$('#business').value||'Seu negócio';st.city=$('#city').value||'Sua cidade';st.phone=$('#phone').value;st.headline=$('#headline').value||niches[st.niche].hero;st.cta=$('#cta').value||niches[st.niche].cta;st.rating=$('#rating').value||'4,8';st.reviews=$('#reviews').value||'+100 avaliações'}function up(){read();$('#frame').srcdoc=site(st);$('#topTitle').textContent=st.business;$('#topMeta').textContent=niches[st.niche].l+' · '+st.city;try{localStorage.setItem('mw-studio',JSON.stringify(st))}catch{}}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.remove('show'),1500)}function dl(){read();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([site(st)],{type:'text/html'}));a.download=(st.business||'demo').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('HTML exportado')}function openP(){read();window.open(URL.createObjectURL(new Blob([site(st)],{type:'text/html'})),'_blank')}async function brief(){read();let md=defs.filter(([k])=>st.mods[k]!==false).map(x=>x[1]).join(', '),txt=`Crie uma demo premium para ${st.business}, nicho ${niches[st.niche].l}, em ${st.city}. Visual ${themes[st.theme].n}. Headline: "${st.headline}". CTA: "${st.cta}". Módulos: ${md}. Mobile-first, conversão via WhatsApp ${st.phone}, acabamento premium e sem aparência genérica.`;await navigator.clipboard.writeText(txt);toast('Briefing copiado')}const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const dec=v=>{try{v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';return JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}async function share(){read();let u=location.origin+location.pat
